jobs:

- job: ExampleJob
  displayName: 'Publish to Azure Service Bus'
  pool:
    vmImage: 'ubuntu-latest'  # Use an appropriate Ubuntu version
  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
      addToPath: true
  - script: |
      python -m pip install --upgrade pip
      pip install azure-identity azure-servicebus
    displayName: 'Install dependencies'
  - task: PythonScript@0
    inputs:
      scriptSource: 'inline'
      script: |
        from azure.servicebus import ServiceBusClient
        from azure.servicebus import ServiceBusMessage
        
        connection_str = "$(connectionstring)"
        queue_name = "testingpipeline"
        
        def send_message_to_queue (connection_str, queue_name):
            servicebus_client = ServiceBusClient.from_connection_string(conn_str=connection_str)
            sender = servicebus_client.get_queue_sender(queue_name=queue_name)
            message = ServiceBusMessage("Hello world 002")
            sender.send_messages (message)
            sender.close()
            servicebus_client.close()
        
            return "Message sent successfully"
        
        if __name__ == '__main__':
            result = send_message_to_queue(connection_str, queue_name)
        print(result)

  - task: PythonScript@0
    inputs:
      scriptSource: 'inline'
      script: |
        from azure.servicebus import ServiceBusClient
        from azure.servicebus import ServiceBusMessage
        
        connection_str = "$(connectionstring)"
        queue_name = "testingpipeline"
        
        def receive_messages_from_queue(conn_str, queue_name):
        # Create a service bus client with the connection string
            servicebus_client = ServiceBusClient.from_connection_string(conn_str=conn_str)
            receiver = servicebus_client.get_queue_receiver (queue_name=queue_name)
            with receiver:
                for message in receiver:
                    print(message)
                    # Complete the message to remove it from the queue
                    receiver.complete_message(message)
                    # Close the service bus client when done
            servicebus_client.close()
        
        if __name__ == '__main__':
            result = receive_messages_from_queue(connection_str, queue_name)
        print(result)