variables:
- group: Nexus  # Ensure this variable group contains your ServiceBusConnectionString variable

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
    addToPath: true

- script: |
    python -m pip install azure-servicebus
  displayName: 'Install Azure Service Bus SDK'

- script: |
    import os
    from azure.servicebus import ServiceBusClient, ServiceBusMessage

    connection_str = os.environ["SERVICE_BUS_CONNECTION_STRING"]
    queue_name = "your-queue-name"

    servicebus_client = ServiceBusClient.from_connection_string(conn_str=connection_str, logging_enable=True)
    with servicebus_client:
        sender = servicebus_client.get_queue_sender(queue_name=queue_name)
        with sender:
            message = ServiceBusMessage("Hello, world!")
            sender.send_messages(message)
    print("Message sent")
  env:
    SERVICE_BUS_CONNECTION_STRING: $(ServiceBusConnectionString)
  displayName: 'Queue a message in Azure Service Bus'
