# Sample Azure Pipeline YAML with one script task
trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    echo "Hello, World!"
    echo "This is a sample script task."
  displayName: 'Run a 1'
  name: taks_1
- script: |
    echo "Hello, World!"
    echo "This is a sample script task."
  displayName: 'Run a 2'
  name: task_2
- script: |
    echo "Hello, World!"
    echo "This is a sample script task."
    exit 1
  displayName: 'Run a 3'
  name: task_3
  continueOnError: true
- script: |
    echo "Checking for failed tasks..."

    failedTasks=()
    
    # Check for failed tasks using the AGENT_JOBSTATUS environment variable
    if [[ "$(echo $AGENT_JOBSTATUS)" != "Succeeded" ]]; then
        echo "Some tasks failed. Checking details..."
        
        taskLogs=$(find $(Agent.TempDirectory) -name "*.log" -type f)
        
        for logFile in $taskLogs; do
            if grep -q "##vso[task.logissue type=error]" "$logFile"; then
                failedTaskName=$(basename "$logFile" .log)
                failedTasks+=("$failedTaskName")
            fi
        done
    fi

    if [ ${#failedTasks[@]} -eq 0 ]; then
        echo "No tasks failed."
    else
        echo "The following tasks failed: ${failedTasks[*]}"
        exit 1
    fi
  displayName: 'Check for Failed Tasks'

