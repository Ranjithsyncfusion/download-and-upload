jobs:

- job: ExampleJob
  displayName: 'Publish to Azure Service Bus'
  pool:
    vmImage: 'ubuntu-latest'  # Use an appropriate Ubuntu version
  steps:
  
  - task: GitHubComment@0
    inputs:
      gitHubConnection: 'bold-bi'
      repositoryName: '$(Build.Repository.Name)'
      comment: 'all is well'
  - task: AzureCLI@2
    inputs:
      azureSubscription: 'SF3358-Bold BI-DevOps-Ranjithkumar(d85cca03-706a-4ff7-81bf-d0a90d9bc685)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az extension add --name azure-servicebus --allow-preview
        az servicebus queue message send --resource-group bus --namespace-name ranjithtesting --queue-name ranjith --body "Message vandhruchae"

    
