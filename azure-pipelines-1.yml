# Sample Azure Pipeline YAML with one script task
trigger:
- main
variables:
  globalVariableName: ''

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    echo "Hello, World!"
    echo "This is a sample script task."
    if [ $? -ne 0 ]; then
        echo "##vso[task.setvariable variable=globalVariableName]Run a 1"
    fi
  displayName: 'Run a 1'
- script: |
    echo "Hello, World!"
    echo "This is a sample script task."
    if [ $? -ne 0 ]; then
        echo "##vso[task.setvariable variable=globalVariableName]Run a 2"
    fi
    exit 1
  displayName: 'Run a 2'
- script: |
    echo "Hello, World!"
    echo "This is a sample script task."
    if [ $? -ne 0 ]; then
        echo "##vso[task.setvariable variable=globalVariableName]Run a 2"
    fi
  displayName: 'Run a 3'
- script: |
    cd $(Agent.WorkFolder)/1/a
    ls
    cd $(Agent.WorkFolder)/1/s
    ls
    cd $(Agent.WorkFolder)/1/b
    ls
    cd $(Agent.WorkFolder)/_temp
    ls
    echo "Failed task name is: $(globalVariableName)."
  displayName: 'Run a 4'
  condition: always()
- script: |
      # Publish logs from a specified directory
      echo "Publishing logs as artifacts"
      mkdir -p $(Pipeline.Workspace)/logs
      cp -r $(Agent.TempDirectory)/* $(Pipeline.Workspace)/logs/
  name: CollectLogs
- script: |
    echo "Checking for failed tasks..."

    failedTasks=()
    
    # Define an array of task names that should be checked for failure
    taskNames=("task_1" "task_2" "task_3")
    
    for taskName in "${taskNames[@]}"; do
        taskStatus=$(eval "echo \$${taskName}_RESULT")

        if [ "$taskStatus" != "Succeeded" ]; then
            failedTasks+=("$taskName")
        fi
    done

    if [ ${#failedTasks[@]} -eq 0 ]; then
        echo "No tasks failed."
    else:
        echo "The following tasks failed: ${failedTasks[*]}"
        exit 1
    fi
  displayName: 'Check for Failed Tasks'