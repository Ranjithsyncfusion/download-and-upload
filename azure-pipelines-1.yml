variables:
  globalVariableName: ''  # Declare the global variable without an initial value

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    echo "Hello, World!"
    echo "This is a sample script task."
    
    # Simulate a failure condition for demonstration
    someCommandThatFails || exitCode=$?

    # Check if the task failed
    if [ "$exitCode" -ne 0 ]; then
        echo "##vso[task.setvariable variable=globalVariableName]Task 1 is failed"
    fi
  displayName: 'Run a 1'

- script: |
    echo "Hello, World!"
    echo "This is a sample script task."
    
    # Simulate another failure
    someOtherCommandThatFails || exitCode=$?
    
    # Check if the task failed
    if [ "$exitCode" -ne 0 ]; then
        echo "##vso[task.setvariable variable=globalVariableName]Task 2 is failed"
        exit $exitCode
    fi
  displayName: 'Run a 2'

- script: |
    echo "Hello, World!"
    echo "This is a sample script task."
    
    # Simulate yet another failure
    yetAnotherCommandThatFails || exitCode=$?

    # Check if the task failed
    if [ "$exitCode" -ne 0 ]; then
        echo "##vso[task.setvariable variable=globalVariableName]Task 3 is failed"
        exit $exitCode
    fi
  displayName: 'Run a 3'

- script: |
    echo "Failed task name is: $(globalVariableName)."
  displayName: 'Run a 4'
  condition: always()  # Run this task regardless of previous task success/failure

- script: |
    # Publish logs from a specified directory
    echo "Publishing logs as artifacts"
    mkdir -p $(Pipeline.Workspace)/logs
    cp -r $(Agent.TempDirectory)/* $(Pipeline.Workspace)/logs/
  displayName: 'Collect Logs'

- script: |
    echo "Checking for failed tasks..."

    # Logic to identify failed tasks (note: this part is not necessary if we use the global variable correctly)
    if [ -n "$(globalVariableName)" ]; then
        echo "The following task failed: $(globalVariableName)"
        exit 1
    else:
        echo "No tasks failed."
    fi
  displayName: 'Check for Failed Tasks'