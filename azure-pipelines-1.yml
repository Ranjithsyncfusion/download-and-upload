pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
    addToPath: true

- script: |
    curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
    az login
    SERVICE_BUS_CONNECTION_STRING=$(ServiceBusConnectionString)
    QUEUE_NAME="testingpipeline"
    MESSAGE_CONTENT="successfully message ah anupiten"

    # Send message to Service Bus queue
    az servicebus message send --queue-name $QUEUE_NAME --body "$MESSAGE_CONTENT" --connection-string "$SERVICE_BUS_CONNECTION_STRING"

    if [ $? -eq 0 ]; then
        echo "Message sent successfully to queue: $QUEUE_NAME"
    else
        echo "Failed to send message to queue: $QUEUE_NAME"
    fi
  env:
    SERVICE_BUS_CONNECTION_STRING: $(ServiceBusConnectionString)
  displayName: 'Queue a message in Azure Service Bus'
