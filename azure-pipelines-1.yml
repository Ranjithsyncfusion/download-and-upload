# Sample Azure Pipeline YAML with one script task
trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    echo "Hello, World!"
    echo "This is a sample script task."
    exit  1
  displayName: 'Run a 1'
  name: taks_1
  continueOnError: true
- script: |
    echo "Hello, World!"
    echo "This is a sample script task."
    exit 1
  displayName: 'Run a 2'
  name: task_2
  continueOnError: true
- script: |
    $(Agent.WorkFolder)/_logs
    ls
  displayName: 'Run a 3'
  name: task_3
  condition: always()
- script: |
    echo "Checking for failed tasks..."

    failedTasks=()
    
    # Define an array of task names that should be checked for failure
    taskNames=("task_1" "task_2" "task_3")
    
    for taskName in "${taskNames[@]}"; do
        taskStatus=$(eval "echo \$${taskName}_RESULT")

        if [ "$taskStatus" != "Succeeded" ]; then
            failedTasks+=("$taskName")
        fi
    done

    if [ ${#failedTasks[@]} -eq 0 ]; then
        echo "No tasks failed."
    else:
        echo "The following tasks failed: ${failedTasks[*]}"
        exit 1
    fi
  displayName: 'Check for Failed Tasks'